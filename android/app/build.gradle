plugins {
    id 'com.android.application'
}

// ビルド設定: リポジトリ直下 config/app.json, config/admob.json (pusherが生成。無ければ既定値)
def cfgDir = new File(rootDir.parentFile, "config")
def readCfg = { String n ->
    def f = new File(cfgDir, n)
    return f.exists() ? new groovy.json.JsonSlurper().parse(f) : [:]
}
def appCfg = readCfg("app.json")
def adCfg = readCfg("admob.json")
def admobTesting = (adCfg.testing == null) ? true : adCfg.testing.toString().toBoolean()
def admobAppId = (!admobTesting && adCfg.appId) ? adCfg.appId.toString() : "ca-app-pub-3940256099942544~3347511713"   // 既定はGoogle公式のテストID
def cfgPackage = appCfg.packageName ? appCfg.packageName.toString() : "tv.hsp.hspproj"
def cfgLabel = appCfg.appName ? appCfg.appName.toString() : "hspproj"
def cfgVerCode = appCfg.versionCode ? appCfg.versionCode.toString().toInteger() : 1
def cfgVerName = appCfg.versionName ? appCfg.versionName.toString() : "1.0"
def cfgOrient = (appCfg.orientation in ["portrait", "landscape", "sensorLandscape", "sensorPortrait", "fullSensor", "unspecified"]) ? appCfg.orientation.toString() : "portrait"

android {
    namespace "tv.hsp.hspproj"
    compileSdkVersion 35

    defaultConfig {
        applicationId cfgPackage
        minSdkVersion 23
        targetSdkVersion 35
        versionCode cfgVerCode
        versionName cfgVerName
        multiDexEnabled true
        manifestPlaceholders = [admobAppId: admobAppId, appLabel: cfgLabel, screenOrientation: cfgOrient]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            ndkBuild {
                cppFlags ''
            }
        }
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword System.getenv("RELEASE_PASSWORD")
            keyAlias "hspapp"
            keyPassword System.getenv("RELEASE_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    useLibrary 'org.apache.http.legacy'
    ndkVersion '26.3.11579264'
    externalNativeBuild {
        ndkBuild {
            path file('jni/Android.mk')
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.2'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    // For apps targeting Android 12, add WorkManager dependency.
    constraints {
        implementation('androidx.work:work-runtime:2.7.0') {
            because '''androidx.work:work-runtime:2.1.0 pulled from play-services-ads
                   has a bug using PendingIntent without FLAG_IMMUTABLE or
                   FLAG_MUTABLE and will fail in apps targeting S+.'''
        }
    }
}