<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<title>%TITLE%</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#e8edf3;overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font:15px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas#canvas{display:block;background:#000;outline:none;touch-action:none}
#boot{position:fixed;inset:0;z-index:50;background:#0b0f14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#boot h1{font-size:20px;margin:0}
#bootMsg{min-height:1.5em;color:#b8c4d2}
#bootProg{width:min(320px,80vw);height:8px;background:#222c38;border-radius:4px;overflow:hidden}
#bootBar{height:100%;width:0;background:#4da3ff;transition:width .2s}
#boot button{padding:14px 28px;border:0;border-radius:12px;background:#4da3ff;color:#fff;font:inherit;font-weight:700;display:none}
#bootLog{display:none;max-width:92vw;max-height:38vh;overflow:auto;text-align:left;white-space:pre-wrap;word-break:break-all;font:11px/1.4 ui-monospace,Menlo,monospace;color:#cfd8e3;background:#05080c;border:1px solid #2c3745;border-radius:8px;padding:8px;margin:0;-webkit-user-select:text;user-select:text;touch-action:pan-y}
#bootReload{display:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:88vw;background:rgba(20,24,30,.92);color:#fff;
  padding:10px 16px;border-radius:10px;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
#diagBtn{position:fixed;top:6px;right:6px;z-index:95;width:34px;height:34px;border-radius:17px;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:18px}
#diag{position:fixed;inset:0;z-index:96;background:rgba(8,12,18,.97);display:none;overflow:auto;padding:12px;touch-action:pan-y;-webkit-user-select:text;user-select:text}
#diagHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#diag button{padding:9px 12px;border:0;border-radius:8px;background:#2f6fd6;color:#fff;font:inherit;margin:4px 6px 0 0}
#diagFilesHead{margin:10px 0 4px;color:#93a1b3;font-size:13px}
#diagFiles{background:#0b0f14;border-radius:8px;padding:4px 8px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#cfd8e3}
#diagFiles .dgRow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:4px 0;border-bottom:1px solid #1d2632}
#diagFiles .dgRow:last-child{border-bottom:0}
#diagFiles .dgName{flex:1 1 140px;word-break:break-all}
#diagFiles button{margin:0;padding:7px 10px}
#diagInfo{white-space:pre-wrap;word-break:break-all;font:12px/1.5 ui-monospace,Menlo,monospace;color:#b8f5c8;background:#0b0f14;padding:8px;border-radius:8px}
#diagLog{width:100%;height:42vh;margin-top:10px;background:#0b0f14;color:#cfd8e3;border:1px solid #2c3745;border-radius:8px;font:11px/1.4 ui-monospace,Menlo,monospace;box-sizing:border-box}
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>
<div id="boot">
  <h1>%TITLE%</h1>
  <div id="bootMsg">読み込み中…</div>
  <div id="bootProg"><div id="bootBar"></div></div>
  <button id="bootBtn" type="button">タップして開始</button>
  <button id="bootReload" type="button" onclick="location.reload()">再読み込み</button>
  <pre id="bootLog"></pre>
</div>
<script>window.__HSP_BUILD="%BUILD%";</script>
<script src="hsp-synth.js?v=%BUILD%"></script>
<script src="mml-engine.js?v=%BUILD%"></script>
<script src="ad-engine.js?v=%BUILD%"></script>
<script src="pad-engine.js?v=%BUILD%"></script>
<script src="hsp-web-runtime.js?v=%BUILD%"></script>
</body>
</html>
